# The one non-standard line in a Forge site's nginx config (Jasper's go, 2026-11-27 13:27Z, house rules rev 28).
# Vite's /build files are content-hashed, so a new release gets new names: browsers may keep each file for a year.
# Paste inside the site's `server { }` block (Forge -> site -> Files -> Edit Nginx Configuration), above `location / {`.
location ^~ /build/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
